<title>すうがく方眼ノート</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: graph-paper notebook (light) / chalkboard (dark). One column; red pen marks correct answers, highlighter marks key ideas. */
:root{
 --paper:#eef3f8;--sheet:#ffffff;--grid:#dde7f0;--grid2:#cfdbe7;--line:#c9d6e3;
 --ink:#18263a;--muted:#5a6b7e;--marker:#ffe04a;--marker-hl:#ffe680;--marker-ink:#18263a;
 --red:#d23f33;--blue:#2a63c4;--green:#1f8455;
 --f-disp:"Dela Gothic One","Zen Maru Gothic","Hiragino Sans",sans-serif;
 --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
 --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --paper:#17221d;--sheet:#1e2c26;--grid:#21302a;--grid2:#2b3d35;--line:#34493f;
 --ink:#edf2ea;--muted:#a2b3a7;--marker:#f0d458;--marker-hl:rgba(240,212,88,.32);--marker-ink:#17221d;
 --red:#ff8d7e;--blue:#8ab9ff;--green:#86d3a2;color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#17221d;--sheet:#1e2c26;--grid:#21302a;--grid2:#2b3d35;--line:#34493f;
 --ink:#edf2ea;--muted:#a2b3a7;--marker:#f0d458;--marker-hl:rgba(240,212,88,.32);--marker-ink:#17221d;
 --red:#ff8d7e;--blue:#8ab9ff;--green:#86d3a2;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.75;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
small{color:var(--muted);font-size:.86em}
b{font-weight:900}
sup,sub{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.15;margin:0 .1em}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr .de{padding:0 .2em}
.rt{border-top:1.5px solid currentColor;padding:0 .1em;margin-left:.05em}
.int{font-size:1.3em}
.mk{background:linear-gradient(transparent 58%,var(--marker-hl) 58%);padding:0 .1em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border:2px solid var(--ink);border-radius:6px;font-style:normal;font-family:var(--f-num);font-size:14px;font-weight:600}
.chip-lv{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.chip-lv .lv{font-family:var(--f-num);font-weight:600}
.xpbar{width:110px;height:8px;border-radius:99px;background:var(--grid2);overflow:hidden}
.xpbar>span{display:block;height:100%;background:var(--blue);transition:width .5s}

.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:28px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.hl{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.lvbig{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;text-align:center;position:relative}
.lvbig svg{position:absolute;inset:0}
.lvbig .n{font-family:var(--f-disp);font-size:40px;line-height:1}
.lvbig .s{font-size:11px;color:var(--muted);letter-spacing:.1em}
.hero h1{font-family:var(--f-disp);font-size:clamp(22px,4vw,30px);font-weight:400}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--f-num);font-size:20px;color:var(--ink);margin-right:3px}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:start}.lvbig{width:96px;height:96px}.lvbig .n{font-size:32px}}

/* grade path */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 12px 8px;font-weight:700;min-width:64px;text-align:center;line-height:1.3}
.tab small{display:block;font-family:var(--f-num);font-size:11px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--sheet);opacity:.75}
.units{display:flex;flex-direction:column;gap:0;margin-top:12px}
.unit{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-bottom:1px dashed var(--line);background:transparent;text-align:left;width:100%}
.unit:last-child{border-bottom:0}
.unit:hover{background:color-mix(in srgb,var(--marker-hl) 45%,transparent)}
.unit .no{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--muted);width:40px;height:40px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center}
.unit.done .no{border-color:var(--red);color:var(--red)}
.unit .tt{font-weight:900;font-size:16px}
.unit .tg{font-size:13px;color:var(--muted);display:block;line-height:1.5}
.marks{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.marks span{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.marks span.on{border-color:var(--green);color:var(--green)}
.stars{font-size:18px;letter-spacing:1px;color:var(--grid2);white-space:nowrap}
.stars .on{color:var(--marker)}
:root[data-theme="light"] .stars .on{color:#e8b400}
@media (prefers-color-scheme:light){.stars .on{color:#e0ad00}}

/* stamps */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:12px}
.stamp{text-align:center;font-size:11.5px;line-height:1.4;color:var(--muted)}
.stamp .seal{width:68px;height:68px;margin:0 auto 6px;border-radius:50%;border:2px dashed var(--grid2);display:grid;place-items:center;font-family:var(--f-disp);font-size:13px;line-height:1.15;color:var(--grid2)}
.stamp.got{color:var(--ink)}
.stamp.got .seal{border:3px double var(--red);color:var(--red);transform:rotate(-8deg)}

/* unit page */
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:700}
.uhead h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,5vw,34px);margin-top:4px}
.gtag{display:inline-block;border:1.5px solid var(--ink);border-radius:6px;padding:0 8px;font-size:12px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:8px 10px;text-align:left;font-weight:700;line-height:1.35;font-size:14px}
.step small{display:block;font-family:var(--f-num);font-size:11px}
.step[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--marker)}
.step .ck{color:var(--green);float:right}
.panel{padding:22px}
.one{font-size:clamp(18px,3.4vw,22px);font-weight:900;line-height:1.6}
.sec{margin-top:20px}
.sec h3{font-size:13px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.keybox{border:2px solid var(--ink);border-radius:10px;padding:14px 16px;font-size:17px;line-height:2;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px;overflow-x:auto}
.trap{color:var(--ink)}
.trap::before{content:"赤ペン";display:inline-block;font-size:11px;font-weight:900;color:var(--red);border:1.5px solid var(--red);border-radius:4px;padding:0 5px;margin-right:8px;transform:rotate(-4deg)}
.next{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.lab{display:flex;flex-direction:column;gap:14px}
.cvwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet)}
canvas.cv{display:block;width:100%;touch-action:pan-y}
.readout{font-size:15.5px;line-height:1.9;min-height:3em;font-variant-numeric:tabular-nums}
.readout .tbl{overflow-x:auto}
.readout table{border-collapse:collapse;margin:6px 0;font-family:var(--f-num);font-size:13px}
.readout td,.readout th{border:1px solid var(--line);padding:2px 12px;text-align:center}
.pr{color:var(--red);font-weight:700}.pb{color:var(--blue);font-weight:700}.pg{color:var(--green);font-weight:700}
.good{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px}
.sl label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}
.sl label output{font-family:var(--f-num);color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}

/* quiz */
.pips{display:flex;gap:6px}
.pips i{flex:1;height:6px;border-radius:9px;background:var(--grid2)}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.cur{background:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:12px 0 6px}
.combo{font-family:var(--f-num);font-weight:600;color:var(--red)}
.q{font-size:clamp(18px,3.6vw,22px);font-weight:700;line-height:1.9;margin:6px 0 16px;overflow-x:auto}
.q .eqs{display:inline-block;border-left:3px solid var(--ink);padding-left:12px;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 14px;font-size:18px;font-weight:700;text-align:left;display:flex;gap:12px;align-items:center;min-height:58px;position:relative;overflow:hidden}
.opt .k{font-family:var(--f-num);font-size:12px;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--sheet))}
.opt.ng{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--sheet));animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.fb .verdict{font-family:var(--f-disp);font-size:20px;font-weight:400}
.fb.ok .verdict{color:var(--red)}
.fb.ng .verdict{color:var(--blue)}
.hana{width:64px;height:64px}
.hana path{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-dasharray:330;stroke-dashoffset:330;animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hint{margin-top:12px;font-size:14px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--marker-hl) 55%,transparent)}
.result{text-align:center;padding:30px 20px}
.result .big{font-family:var(--f-disp);font-size:56px;line-height:1}
.result .rst{font-size:44px;letter-spacing:6px;color:var(--grid2)}
.result .rst .on{color:var(--marker)}
.result .rst span{display:inline-block;animation:pop .45s backwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.gain{display:inline-flex;gap:16px;margin:12px 0;font-size:14px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.gain b{font-family:var(--f-num);color:var(--ink);font-size:20px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--ink);color:var(--sheet);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;animation:tin .3s}
#toast div.lvup{background:var(--marker);color:var(--marker-ink)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.foot{font-size:12.5px;color:var(--muted);line-height:1.7}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hana path{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
 <button class="logo" id="home" aria-label="ホームへ"><i>÷</i>すうがく方眼ノート</button>
 <div class="chip-lv" id="chip"></div>
</div></header>
<main id="app" class="wrap"></main>
<div id="toast" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
// ===== helpers =====
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rnz=(a,b)=>{let v;do{v=ri(a,b)}while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const neg=n=>n<0?'−'+(-n):''+(n===0?0:n);
const paren=n=>n<0?'('+neg(n)+')':''+n;
const fr=(n,d)=>`<span class="fr"><span class="nu">${n}</span><span class="de">${d}</span></span>`;
const rt=x=>`√<span class="rt">${x}</span>`;
const X2='x<sup>2</sup>',X3='x<sup>3</sup>';
function poly(terms){let s='';terms.forEach(([c,v])=>{if(c===0)return;const ab=Math.abs(c);const cs=(ab===1&&v)?'':ab;if(!s)s=(c<0?'−':'')+cs+v;else s+=(c<0?' − ':' + ')+cs+v});return s||'0'}
function F(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;if(d===1)return neg(n);return (n<0?'−':'')+fr(Math.abs(n),d)}
function Fpi(n,d){if(n===0)return '0';if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;const s=n<0?'−':'';n=Math.abs(n);if(d===1)return s+(n===1?'':n)+'π';return s+fr((n===1?'':n)+'π',d)}
function simpRt(n){let k=1,m=n;for(let i=Math.floor(Math.sqrt(n));i>1;i--){if(n%(i*i)===0){k=i;m=n/(i*i);break}}if(m===1)return String(k);return (k===1?'':k)+rt(m)}
function cplx(a,b){if(b===0)return neg(a);const ib=(Math.abs(b)===1?'':Math.abs(b))+'i';if(a===0)return (b<0?'−':'')+ib;return neg(a)+(b<0?' − ':' + ')+ib}
const pt=(x,y)=>`(${neg(x)}, ${neg(y)})`;
const deg=v=>v+'°';
const fac=a=>a>0?`(x + ${a})`:`(x − ${-a})`;
function fac2(p,q){if(p<q)[p,q]=[q,p];return p===q?fac(p)+'<sup>2</sup>':fac(p)+fac(q)}
const xs=(p,q)=>{if(p>q)[p,q]=[q,p];return p===q?`x = ${neg(p)}`:`x = ${neg(p)}, ${neg(q)}`};
const lg=(b,x)=>`log<sub>${b}</sub> ${x}`;
const pw=(b,e)=>`${b}<sup>${e}</sup>`;
const LIM='lim<sub>n→∞</sub> ';
// trig table
const TV={'0':'0','1':'1','h':fr(1,2),'r2':fr(1,rt(2)),'r3h':fr(rt(3),2),'ir3':fr(1,rt(3)),'r3':rt(3)};
const tv=k=>k[0]==='-'?'−'+TV[k.slice(1)]:TV[k];
const negKey=k=>k==='0'?'0':k[0]==='-'?k.slice(1):'-'+k;
const TRIG={0:{s:'0',c:'1',t:'0'},30:{s:'h',c:'r3h',t:'ir3'},45:{s:'r2',c:'r2',t:'1'},60:{s:'r3h',c:'h',t:'r3'},90:{s:'1',c:'0',t:null},120:{s:'r3h',c:'-h',t:'-r3'},135:{s:'r2',c:'-r2',t:'-1'},150:{s:'h',c:'-r3h',t:'-ir3'},180:{s:'0',c:'-1',t:'0'}};
const TPOOL=['0','1','-1','h','-h','r2','-r2','r3h','-r3h','ir3','-ir3','r3','-r3'];
const FN={s:'sin',c:'cos',t:'tan'};
function trigQ(ang,label){let fns=ang===90?['s','c']:['s','c','t'];const f=pick(fns);const k=TRIG[ang][f];
  const cand=[...['s','c','t'].filter(x=>x!==f).map(x=>TRIG[ang][x]).filter(Boolean),negKey(k),...shuffle(TPOOL.slice())];
  const d=[];cand.forEach(x=>{if(x!==k&&!d.includes(x))d.push(x)});
  return {q:`${FN[f]} ${label} の値は?`,a:tv(k),d:d.map(tv),
    ex:`半径1の円(単位円)で角 ${label} の点は (cos, sin) = (${tv(TRIG[ang].c)}, ${tv(TRIG[ang].s)})。${f==='t'?'tan = sin ÷ cos で '+tv(k)+'。':FN[f]+' は '+(f==='s'?'高さ':'横の位置')+'なので '+tv(k)+'。'}`}}

// ===== units =====
const U=[];
const unit=o=>U.push(o);

// ---------- 中1 ----------
unit({id:'j1a',g:'中1',t:'正の数・負の数',tag:'マイナスは「反対向き」',lab:'numberline',
one:'マイナスは「反対の向き」をあらわす記号。',
story:'数直線を東西にのびる道と考えよう。0 が家、＋は東へ、−は西へ進む。「−3」は西に3歩の場所。たし算は「そこからさらに歩く」、ひき算は「向きを反対にして歩く」こと。',
key:'(−) × (−) = (+)<br><small>反対の反対は、もとの向き。</small>',
trap:'−3 − (−5) は「−5 を取りのぞく」こと。これは +5 と同じなので、答えは 2。',
gen(){const a=rnz(-9,9),b=rnz(-9,9),op=pick(['+','−','×']);const ans=op==='+'?a+b:op==='−'?a-b:a*b;const alt=op==='+'?a-b:op==='−'?a+b:-ans;
 let ex;if(op==='+')ex=`数直線で ${neg(a)} から${b>0?'右':'左'}へ ${Math.abs(b)} 進むと ${neg(ans)}。`;
 else if(op==='−')ex=`「${paren(b)} をひく」は「${paren(-b)} をたす」と同じ。${neg(a)} + ${paren(-b)} = ${neg(ans)}。`;
 else ex=`符号は ${(a<0)!==(b<0)?'(＋と−なので) −':'(同じ符号なので) ＋'}、数の部分は ${Math.abs(a)}×${Math.abs(b)} = ${Math.abs(ans)}。`;
 return {q:`${neg(a)} ${op} ${paren(b)} を計算しよう`,a:neg(ans),d:[neg(-ans),neg(alt),neg(ans+1),neg(ans-2)],ex}}});

unit({id:'j1b',g:'中1',t:'文字と式',tag:'文字は「あとで数を入れる箱」',lab:'machine',
one:'文字は「あとで数を入れる箱」。',
story:'1個 x 円のパンを3個と、100円の牛乳を買うと代金は 3x + 100 円。x にいくらを入れても使える「計算のレシピ」になる。',
key:'3x は 3 × x のこと。<br>同じ文字どうしだけまとめられる:2x + 5x = 7x',
trap:'2x + 3 を 5x にしない。x の箱と、ただの数は別の種類。',
gen(){if(Math.random()<.5){const a=rnz(-5,5),b=rnz(-9,9),k=rnz(-4,4);const ans=a*k+b;
  return {q:`x = ${neg(k)} のとき、${poly([[a,'x'],[b,'']])} の値は?`,a:neg(ans),d:[neg(a*k-b),neg(-a*k+b),neg(a+k+b),neg(ans+a)],
  ex:`x の箱に ${paren(k)} を入れる:${neg(a)} × ${paren(k)} ${b<0?'−':'+'} ${Math.abs(b)} = ${neg(a*k)} ${b<0?'−':'+'} ${Math.abs(b)} = ${neg(ans)}。`}}
 const a=rnz(-6,6),b=rnz(-9,9),c=rnz(-6,6),d=rnz(-9,9);
 return {q:`(${poly([[a,'x'],[b,'']])}) + (${poly([[c,'x'],[d,'']])}) を簡単にしよう`,a:poly([[a+c,'x'],[b+d,'']]),
 d:[poly([[a+c+b+d,'x']]),poly([[a+c,'x'],[b-d,'']]),poly([[a-c,'x'],[b+d,'']]),poly([[a*c,'x'],[b+d,'']])],
 ex:`x の仲間どうし:${neg(a)} + ${paren(c)} = ${neg(a+c)}。数どうし:${neg(b)} + ${paren(d)} = ${neg(b+d)}。`}}});

unit({id:'j1c',g:'中1',t:'一次方程式',tag:'方程式は「つり合った天びん」',lab:'balance',
one:'方程式は「つり合った天びん」。両側に同じことをすれば、つり合いはくずれない。',
story:'左の皿に箱(x)が2つと重り3個、右の皿に重り11個。両側から重りを3個ずつ取ると「箱2つ = 重り8個」。だから箱1つは重り4個分、x = 4。',
key:'ax + b = c<br>→ ax = c − b<br>→ x = (c − b) ÷ a',
trap:'移項すると符号が変わる。左の +3 を右へ移すと −3 になる。',
gen(){const x=rnz(-5,8),a=pick([2,3,4,5,6,-2,-3,-4]),b=rnz(-9,9),c=a*x+b;
 return {q:`${poly([[a,'x'],[b,'']])} = ${neg(c)} を解こう`,a:`x = ${neg(x)}`,
 d:[`x = ${neg(-x)}`,`x = ${F(c+b,a)}`,`x = ${neg(x+1)}`,`x = ${F(c-b,-a)}`,`x = ${neg(c-b)}`],
 ex:`${b>0?'両辺から '+b+' をひく':'両辺に '+(-b)+' をたす'} → ${poly([[a,'x']])} = ${neg(c-b)} → 両辺を ${paren(a)} でわって x = ${neg(x)}。`}}});

const DIV={12:[1,2,3,4,6,12],18:[1,2,3,6,9,18],24:[1,2,3,4,6,8,12,24],36:[1,2,3,4,6,9,12,18,36]};
unit({id:'j1d',g:'中1',t:'比例・反比例',tag:'「一緒にふえる」と「かけると一定」',lab:'prop',
one:'比例は「一緒に同じ倍率でふえる」、反比例は「かけた答えがいつも同じ」。',
story:'1本80円のペンは、本数が2倍なら代金も2倍(比例 y = 80x)。12枚のクッキーを分けるとき、人数が2倍なら1人分は半分(反比例 y = 12 ÷ x)。',
key:`比例 y = ax(原点を通る直線)<br>反比例 y = ${fr('a','x')}(双曲線)`,
trap:'「片方がふえて片方がへる」だけでは反比例とは限らない。x × y がいつも同じかを確かめよう。',
gen(){if(Math.random()<.5){const a=rnz(-5,5),p=ri(1,5),r=rnz(-6,6);
  return {q:`y は x に比例し、x = ${p} のとき y = ${neg(a*p)}。x = ${neg(r)} のときの y は?`,a:neg(a*r),d:[neg(-a*r),F(a*p*p,r),neg(a*r+a),neg(a*p+r)],
  ex:`y = ax に代入して a = ${neg(a*p)} ÷ ${p} = ${neg(a)}。y = ${neg(a)} × ${paren(r)} = ${neg(a*r)}。`}}
 const k=pick([12,18,24,36])*pick([1,-1]);const ds=DIV[Math.abs(k)];const p=pick(ds);let r;do{r=pick(ds)}while(r===p);
 return {q:`y は x に反比例し、x = ${p} のとき y = ${neg(k/p)}。x = ${r} のときの y は?`,a:neg(k/r),d:[F(k*r,p*p),neg(-k/r),F(r,k),neg(k/r+1)],
 ex:`反比例は x × y が一定。${p} × ${paren(k/p)} = ${neg(k)}。だから y = ${neg(k)} ÷ ${r} = ${neg(k/r)}。`}}});

unit({id:'j1e',g:'中1',t:'おうぎ形',tag:'ピザ1切れは円の何分のいくつ?',lab:'sector',
one:'おうぎ形は「ピザの1切れ」。円全体の何分のいくつかを考える。',
story:'中心角が90°なら、360°のうちの90°なので円の4分の1。面積も、弧(まわりの曲線)の長さも、円の4分の1になる。',
key:`弧の長さ = 2πr × ${fr('a','360')}<br>面積 = πr<sup>2</sup> × ${fr('a','360')}`,
trap:'面積は半径を2乗する。弧の式(2πr)と面積の式(πr²)を取りちがえやすい。',
gen(){const r=ri(2,9),t=pick([30,45,60,90,120,135,150,240,270]);const area=Math.random()<.6;
 const A=Fpi(r*r*t,360),L=Fpi(2*r*t,360);
 return area?{q:`半径 ${r} cm、中心角 ${t}° のおうぎ形の面積は?`,a:A+' cm<sup>2</sup>',d:[L+' cm<sup>2</sup>',Fpi(r*r*t,180)+' cm<sup>2</sup>',Fpi(r*t,360)+' cm<sup>2</sup>',Fpi(r*r,1)+' cm<sup>2</sup>'],
   ex:`円全体の ${F(t,360)}。π × ${r}<sup>2</sup> × ${F(t,360)} = ${A} cm<sup>2</sup>。`}
 :{q:`半径 ${r} cm、中心角 ${t}° のおうぎ形の弧の長さは?`,a:L+' cm',d:[A+' cm',Fpi(r*t,360)+' cm',Fpi(4*r*t,360)+' cm',Fpi(2*r,1)+' cm'],
   ex:`円周 2π × ${r} の ${F(t,360)}。2π × ${r} × ${F(t,360)} = ${L} cm。`}}});

unit({id:'j1f',g:'中1',t:'データの活用',tag:'たくさんの数を「ひとこと」で',lab:'dots',
one:'たくさんの数を「ひとことで言う」ための値が代表値。',
story:'平均値は全部を同じ高さにならした値。中央値は小さい順に並べたときのまん中。最頻値はいちばん多く出てくる値。',
key:'平均値 = 合計 ÷ 個数<br>中央値 = 並べたまん中の値',
trap:'1つだけ極端な値があると、平均値は大きく引っぱられる。中央値はほとんど動かない(「さわってみる」で確かめよう)。',
gen(){const v=[ri(1,20),ri(1,20),ri(1,20),ri(1,20)];const s=v.reduce((a,b)=>a+b,0);let f=ri(1,20);f+=(5-(s+f)%5)%5;if(f>20)f-=5;v.push(f);
 const sorted=v.slice().sort((a,b)=>a-b);const mean=(s+f)/5,med=sorted[2];const list=shuffle(v.slice()).join(', ');
 if(Math.random()<.5)return {q:`データ「${list}」の平均値は?`,a:''+mean,d:[''+med,''+(s+f),''+(sorted[4]-sorted[0]),''+(mean+1)],ex:`合計 ${s+f} を個数 5 でわって ${mean}。`};
 return {q:`データ「${list}」の中央値は?`,a:''+med,d:[''+mean,''+v[2],''+(sorted[4]-sorted[0]),''+sorted[1]],ex:`小さい順に ${sorted.join(', ')}。まん中(3番目)は ${med}。`}}});

unit({id:'j2a',g:'中2',t:'連立方程式',tag:'2本の直線が交わる1点',lab:'system',
one:'連立方程式の答えは、2本の直線が交わる1点。',
story:'「りんご1個とみかん2個で200円、りんご1個とみかん1個で150円」。2つを見くらべると、ちがいはみかん1個で50円。片方の文字を消すのがコツ。',
key:'加減法:式どうしをたす・ひくで文字を消す<br>代入法:x = … を、もう一方の式に入れる',
trap:'式を何倍かするときは、右辺(= の右側)にも同じ数をかけるのを忘れない。',
gen(){const x=rnz(-4,5),y=rnz(-4,5);let a1,b1,a2,b2;do{a1=rnz(-3,3);b1=rnz(-3,3);a2=rnz(-3,3);b2=rnz(-3,3)}while(a1*b2-a2*b1===0);
 const c1=a1*x+b1*y,c2=a2*x+b2*y;const s=(p,q)=>`x = ${neg(p)}, y = ${neg(q)}`;
 return {q:`次の連立方程式を解こう<br><span class="eqs">${poly([[a1,'x'],[b1,'y']])} = ${neg(c1)}<br>${poly([[a2,'x'],[b2,'y']])} = ${neg(c2)}</span>`,a:s(x,y),
 d:[s(y,x),s(-x,-y),s(x,-y),s(x+1,y-1),s(-x,y)],
 ex:`x か y の係数をそろえてたす(ひく)と片方が消える。確かめ:${neg(a1)}×${paren(x)} ${b1<0?'−':'+'} ${Math.abs(b1)}×${paren(y)} = ${neg(c1)} ✓`}}});

unit({id:'j2b',g:'中2',t:'一次関数',tag:'スタート地点と、1歩ごとの増え方',lab:'linear',
one:'y = ax + b は「スタート地点 b から、x が1増えるごとに a ずつ進む」。',
story:'基本料金500円、1時間ごとに200円の駐車場は y = 200x + 500。b(切片)はグラフが y 軸と交わる高さ、a(傾き)は坂の急さ。',
key:'傾き a = (y の増加量) ÷ (x の増加量)',
trap:'傾きの分母と分子を逆にしない。「たての変化 ÷ よこの変化」。',
gen(){const a=rnz(-4,4),b=ri(-6,6),x1=ri(-3,2),x2=x1+ri(1,4),y1=a*x1+b,y2=a*x2+b;
 const head=`2点 ${pt(x1,y1)}, ${pt(x2,y2)} を通る直線の`;
 if(Math.random()<.5)return {q:head+'傾きは?',a:neg(a),d:[F(x2-x1,y2-y1),neg(-a),neg(y2-y1),neg(a+1)],ex:`(${neg(y2)} − ${paren(y1)}) ÷ (${neg(x2)} − ${paren(x1)}) = ${neg(y2-y1)} ÷ ${x2-x1} = ${neg(a)}。`};
 const L=(p,q)=>'y = '+poly([[p,'x'],[q,'']]);
 return {q:head+'式は?',a:L(a,b),d:[L(a,-b),L(-a,b),L(b||1,a),L(a,b+a)],ex:`傾きは ${neg(y2-y1)} ÷ ${x2-x1} = ${neg(a)}。y = ${neg(a)}x + b に ${pt(x1,y1)} を入れて b = ${neg(b)}。`}}});

unit({id:'j2c',g:'中2',t:'図形の角度',tag:'三角形の角を集めると一直線',lab:'triangle',
one:'三角形の3つの角を切り取って並べると、ちょうど一直線(180°)になる。',
story:'紙の三角形の角を3つちぎって並べてみると、まっすぐな線になる。n角形は、対角線で三角形 (n − 2) 個に分けられる。',
key:'三角形の内角の和 = 180°<br>n角形の内角の和 = 180° × (n − 2)<br>多角形の外角の和 = 360°',
trap:'外角の和は、何角形でもいつも360°。角の数で変わらない。',
gen(){const t=ri(0,3);
 if(t===0){const A=ri(25,95),B=ri(20,150-A),C=180-A-B;return {q:`三角形の2つの角が ${A}° と ${B}°。残りの角は?`,a:deg(C),d:[deg(360-A-B),deg(180-A),deg(A+B),deg(C+10)],ex:`180° − ${A}° − ${B}° = ${C}°。`}}
 if(t===1){const n=ri(5,10);return {q:`${n}角形の内角の和は?`,a:deg(180*(n-2)),d:[deg(180*n),deg(180*(n-1)),deg(360),deg(180*(n-3))],ex:`三角形 ${n-2} 個に分けられるので 180° × ${n-2} = ${180*(n-2)}°。`}}
 if(t===2){const A=ri(30,80),B=ri(30,80);return {q:`三角形の2つの内角が ${A}° と ${B}°。残りの頂点の外角は?`,a:deg(A+B),d:[deg(180-A-B),deg(180-A),deg(Math.abs(A-B)||5),deg(360-A-B)],ex:`外角 = となりにない2つの内角の和 = ${A}° + ${B}° = ${A+B}°。`}}
 const n=pick([5,6,8,9,10,12]);return {q:`正${n}角形の1つの外角は?`,a:deg(360/n),d:[deg(180*(n-2)/n),deg(180/n),deg(360/(n-2)),deg(360)].map(s=>s.includes('.')?deg(Math.round(parseFloat(s))+1):s),ex:`外角の和は360°。それを ${n} 等分して ${360/n}°。`}}});

unit({id:'j2d',g:'中2',t:'確率',tag:'全部を「同じ起こりやすさ」で数える',lab:'dice',
one:'確率 = (起こる場合の数) ÷ (全部の場合の数)。ただし全部が同じくらい起こりやすいことが条件。',
story:'さいころ2個の目の和は 2〜12 の11種類。でも7がいちばん出やすい。2個を区別して36通りを表にすると、和が7は (1,6)(2,5)…(6,1) の6通りもあるから。',
key:`確率 = ${fr('起こる場合の数','すべての場合の数')}`,
trap:'「和は11通りだから 1/11」はまちがい。2個のさいころは区別して36通りで数える。',
gen(){const t=ri(0,3);
 if(t===0){const s=ri(2,12),c=6-Math.abs(s-7);return {q:`さいころを2個投げる。目の和が ${s} になる確率は?`,a:F(c,36),d:[F(1,11),F(c,11),F(c+1,36),F(1,6)],ex:`36通りのうち、和が ${s} になるのは ${c} 通り。${c}/36 = ${F(c,36)}。`}}
 if(t===1)return {q:'さいころを2個投げる。少なくとも1個が6になる確率は?',a:F(11,36),d:[F(1,6),F(1,3),F(1,36),F(25,36)],ex:'「どちらも6でない」は 5×5 = 25 通り。1 − 25/36 = 11/36(余事象)。'};
 const n=ri(2,4),N=2**n;
 if(t===2)return {q:`コインを ${n} 回投げる。すべて表になる確率は?`,a:F(1,N),d:[F(1,2*n),F(n,N),F(1,n+1),F(1,2)],ex:`表裏の出方は 2<sup>${n}</sup> = ${N} 通り。すべて表は1通りなので 1/${N}。`};
 return {q:`コインを ${n} 回投げる。少なくとも1回表が出る確率は?`,a:F(N-1,N),d:[F(1,N),F(1,2),F(n,N),F(N-2,N)],ex:`「1回も表が出ない」は1通り。1 − 1/${N} = ${(N-1)}/${N}。`}}});

unit({id:'j3a',g:'中3',t:'展開と因数分解',tag:'長方形の面積を分けて考える',lab:'area',
one:'展開は「長方形の面積を分けて足す」こと。因数分解はその逆。',
story:'たて x + a、よこ x + b の長方形は、x² の正方形、ax と bx の細長い長方形、ab の小さな長方形の4つに分けられる。',
key:`(x + a)(x + b) = ${X2} + (a + b)x + ab<br><small>因数分解は「かけて ab、たして a + b」の2数さがし</small>`,
trap:`定数項がプラスでも、2数が両方マイナスのことがある。${X2} − 5x + 6 = (x − 2)(x − 3)`,
gen(){const a=rnz(-7,7),b=rnz(-7,7);let p=a,q=b;if(p<q)[p,q]=[q,p];
 return {q:`${poly([[1,X2],[a+b,'x'],[a*b,'']])} を因数分解しよう`,a:fac2(p,q),d:[fac2(-p,-q),fac2(p,-q),fac2(-p,q)],
 ex:`かけて ${neg(a*b)}、たして ${neg(a+b)} になる2数は ${neg(p)} と ${neg(q)}。`}}});

unit({id:'j3b',g:'中3',t:'平方根',tag:'面積から1辺の長さを知る',lab:'sqrt',
one:'√a は「面積が a の正方形の1辺の長さ」。',
story:'面積2の正方形の1辺は 1.414… とどこまでも続き、分数では表せない。だから √2 という記号で表す。',
key:`√(a<sup>2</sup>b) = a√b(例:√12 = √(4×3) = 2√3)<br>√a × √b = √(ab)`,
trap:'√2 + √3 は √5 にならない。中身が違う√のたし算はまとめられない。',
gen(){const t=ri(0,2);
 if(t===0){const k=ri(2,5),m=pick([2,3,5,6,7]),n=k*k*m;return {q:`${rt(n)} を a√b の形にしよう`,a:k+rt(m),d:[m+rt(k),(k*k)+rt(m),(k+1)+rt(m),k+rt(m+1)],ex:`${n} = ${k*k} × ${m}。${rt(k*k)} = ${k} なので ${k}${rt(m)}。`}}
 if(t===1){const [a,b]=pick([[2,8],[3,12],[2,18],[5,20],[3,27],[6,24],[2,6],[3,6],[2,10],[6,10],[3,15]]);const ans=simpRt(a*b);
  return {q:`${rt(a)} × ${rt(b)} = ?`,a:ans,d:[rt(a+b),''+(a*b),simpRt(a*b*2),simpRt(a+b)].filter(x=>x!==ans),ex:`√a × √b = √(ab) = ${rt(a*b)} = ${ans}。`}}
 let n;do{n=ri(2,80)}while(Number.isInteger(Math.sqrt(n)));const f=Math.floor(Math.sqrt(n));const R=x=>`${x} と ${x+1} の間`;
 return {q:`${rt(n)} はどの整数の間にある?`,a:R(f),d:[R(f+1),R(f-1),R(Math.floor(n/2)),R(f+2)],ex:`${f}<sup>2</sup> = ${f*f}、${f+1}<sup>2</sup> = ${(f+1)**2}。${n} はその間なので ${rt(n)} は ${f} と ${f+1} の間。`}}});

unit({id:'j3c',g:'中3',t:'二次方程式',tag:'放物線が x 軸と交わる場所',lab:'roots',
one:'二次方程式の答えは「放物線が x 軸と交わる場所」。',
story:'2つの数をかけて0になるなら、どちらかが0。(x − 2)(x − 5) = 0 なら、x = 2 か x = 5。',

 return {q:`${poly([[1,X2],[-(p+q),'x'],[p*q,'']])} = 0 を解こう`,a:xs(p,q),d:[xs(-p,-q),xs(p,-q),xs(-p,q),xs(p+1,q)],
 ex:`因数分解すると ${fac2(-p,-q)} = 0。だから ${xs(p,q)}。`}}});

unit({id:'j3d',g:'中3',t:'関数 y = ax²',tag:'2倍進むと4倍の距離',lab:'ax2',
one:'y = ax² では、x が2倍になると y は4倍になる。',
story:'坂を転がるボールが進む距離は、時間の2乗に比例する。1秒で1m なら、2秒で4m、3秒で9m。',
key:'変化の割合 = (y の増加量) ÷ (x の増加量)<br>x が p から q まで → a(p + q)',
trap:'一次関数と違って、変化の割合は区間ごとに変わる。',
gen(){const a=pick([1,2,3,-1,-2,-3]),p=ri(-3,2),q=p+ri(1,4);
 if(Math.random()<.6)return {q:`y = ${poly([[a,X2]])} で、x が ${neg(p)} から ${neg(q)} まで増加するときの変化の割合は?`,a:neg(a*(p+q)),d:[neg(a*(q-p)),neg(a*(q*q-p*p)),neg(-a*(p+q)),neg(a*(p+q)+a)],
  ex:`y は ${neg(a*p*p)} から ${neg(a*q*q)} まで ${neg(a*(q*q-p*p))} 増える。÷ ${q-p} で ${neg(a*(p+q))}。`};
 const r=rnz(-4,4);return {q:`y = ${poly([[a,X2]])} で x = ${neg(r)} のときの y は?`,a:neg(a*r*r),d:[neg(2*a*r),neg(a*r),neg(-a*r*r),neg(a*r*r+a)],ex:`${neg(a)} × ${paren(r)}<sup>2</sup> = ${neg(a)} × ${r*r} = ${neg(a*r*r)}。`}}});

unit({id:'j3e',g:'中3',t:'相似',tag:'拡大コピーで面積と体積はどうなる?',lab:'similar',
one:'形を k 倍に拡大すると、長さは k 倍、面積は k² 倍、体積は k³ 倍。',
story:'写真を2倍に引きのばすと、たても横も2倍。だから紙の面積は 2 × 2 = 4 倍になる。',
key:'相似比 m : n → 面積比 m<sup>2</sup> : n<sup>2</sup>、体積比 m<sup>3</sup> : n<sup>3</sup>',
trap:'面積比を m : n のままにしない。2乗する。',
gen(){const [m,n]=pick([[1,2],[2,3],[1,3],[3,4],[2,5],[3,5]]);const R=(a,b)=>`${a} : ${b}`;const t=ri(0,2);
 if(t===0)return {q:`相似比が ${R(m,n)} の2つの図形。面積比は?`,a:R(m*m,n*n),d:[R(m,n),R(m**3,n**3),R(2*m,2*n+1),R(m*m,n)],ex:`面積は2乗。${m}<sup>2</sup> : ${n}<sup>2</sup> = ${R(m*m,n*n)}。`};
 if(t===1)return {q:`相似比が ${R(m,n)} の2つの立体。体積比は?`,a:R(m**3,n**3),d:[R(m*m,n*n),R(m,n),R(3*m,3*n+1),R(m**3,n*n)],ex:`体積は3乗。${m}<sup>3</sup> : ${n}<sup>3</sup> = ${R(m**3,n**3)}。`};
 return {q:`面積比が ${R(m*m,n*n)} の相似な図形。相似比は?`,a:R(m,n),d:[R(m*m,n*n),R(m**3,n**3),R(2*m,n),R(m,2*n)],ex:`面積比は相似比の2乗。√ をとって ${R(m,n)}。`}}});

unit({id:'j3f',g:'中3',t:'三平方の定理',tag:'直角三角形と3つの正方形',lab:'pythag',
one:'直角三角形では、短い2辺でつくった正方形の面積の合計が、いちばん長い辺(斜辺)の正方形の面積と同じ。',
story:'辺が 3, 4, 5 の三角形を考えると、3² + 4² = 9 + 16 = 25 = 5²。「さわってみる」で正方形の面積を見くらべよう。',
key:'a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup><br><small>c は直角の向かいの辺(斜辺)</small>',
trap:'斜辺を求めるときは足す。ほかの辺を求めるときは引く。',
gen(){const t=ri(0,2);
 if(t===0){const [a,b,c]=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25]]);return {q:`直角をはさむ2辺が ${a} と ${b} の直角三角形。斜辺は?`,a:''+c,d:[''+(a+b),simpRt(a+b),''+(c+1),''+(b-a+c)],ex:`${a}<sup>2</sup> + ${b}<sup>2</sup> = ${a*a} + ${b*b} = ${c*c}。√${c*c} = ${c}。`}}
 if(t===1){const [a,b,c]=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]);return {q:`斜辺が ${c}、もう1辺が ${a} の直角三角形。残りの辺は?`,a:''+b,d:[simpRt(a*a+c*c),''+(c-a),''+(c+a),''+(b+1)],ex:`${c}<sup>2</sup> − ${a}<sup>2</sup> = ${c*c-a*a}。√${c*c-a*a} = ${b}。`}}
 const [a,b]=pick([[1,1],[1,2],[2,3],[1,3],[2,4],[3,3],[2,2]]);const s=a*a+b*b;return {q:`直角をはさむ2辺が ${a} と ${b} の直角三角形。斜辺は?`,a:simpRt(s),d:[''+(a+b),simpRt(a+b),simpRt(s+1),''+s],ex:`${a*a} + ${b*b} = ${s}。斜辺は ${rt(s)}${simpRt(s)!==rt(s)?' = '+simpRt(s):''}。`}}});

unit({id:'j3g',g:'中3',t:'円周角',tag:'どこから見ても同じ角度',lab:'inscribed',
one:'同じ弧に向かう円周角は、点が円周上のどこに動いても同じ。そして中心角の半分。',
story:'円形の客席から舞台の両はしを見る角度は、円周上の席ならどこに座っても同じになる。',
key:'円周角 = 中心角 ÷ 2<br>直径に対する円周角 = 90°',
trap:'中心角 → 円周角は「半分」、円周角 → 中心角は「2倍」。逆にしない。',
gen(){const t=ri(0,2);
 if(t===0){const c=2*ri(20,80);return {q:`弧 AB に対する中心角が ${c}°。同じ弧に対する円周角は?`,a:deg(c/2),d:[deg(c),deg(180-c/2),deg(90+c/2),deg(c*2>360?c-10:c*2)],ex:`円周角は中心角の半分。${c}° ÷ 2 = ${c/2}°。`}}
 if(t===1){const x=ri(20,80);return {q:`弧 AB に対する円周角が ${x}°。中心角は?`,a:deg(2*x),d:[deg(x),deg(x/2|0),deg(180-x),deg(360-2*x)],ex:`中心角は円周角の2倍。${x}° × 2 = ${2*x}°。`}}
 const x=ri(25,65);return {q:`AB が円の直径で、円周上の点 P について ∠PAB = ${x}°。∠PBA は?`,a:deg(90-x),d:[deg(x),deg(180-x),deg(90+x),deg(2*x)],ex:`直径に対する円周角 ∠APB = 90°。三角形の内角の和から 180° − 90° − ${x}° = ${90-x}°。`}}});

unit({id:'h1a',g:'数I',t:'二次関数',tag:'放物線をスライドさせる',lab:'vertex',
one:'y = a(x − p)² + q の形にすれば、頂点 (p, q) がひと目でわかる。',
story:'y = x² のグラフを、右に p、上に q だけスライドさせたものが y = (x − p)² + q。この形に直すことを平方完成という。',
key:`${X2} + bx + c = (x + ${fr('b','2')})<sup>2</sup> + c − ${fr('b<sup>2</sup>','4')}<br>頂点 (−${fr('b','2')}, c − ${fr('b<sup>2</sup>','4')})`,
trap:'(x − 3)² の頂点の x 座標は +3。かっこの中の符号と逆になる。',
gen(){if(Math.random()<.7){const b=2*rnz(-4,4),c=ri(-6,8),h=-b/2,k=c-b*b/4;
  return {q:`y = ${poly([[1,X2],[b,'x'],[c,'']])} の頂点は?`,a:pt(h,k),d:[pt(-h,k),pt(h,c),pt(h,c+b*b/4),pt(-h,c)],ex:`平方完成:y = ${fac(-h)}<sup>2</sup> ${k<0?'−':'+'} ${Math.abs(k)}。頂点は ${pt(h,k)}。`}}
 const a=pick([2,3,-1,-2]),p=rnz(-4,4),q=ri(-5,5);return {q:`y = ${a===-1?'−':a}${fac(-p)}<sup>2</sup> ${q<0?'−':'+'} ${Math.abs(q)} の頂点は?`,a:pt(p,q),d:[pt(-p,q),pt(p,-q),pt(-p,-q),pt(a*p,q)],ex:`y = a(x − p)<sup>2</sup> + q の頂点は (p, q)。かっこの中が ${fac(-p)} なので p = ${neg(p)}。`}}});

unit({id:'h1b',g:'数I',t:'三角比',tag:'観覧車の高さと横の位置',lab:'unitcircle',
one:'sin と cos は「半径1の円をまわる点の、高さ(sin)と横の位置(cos)」。',
story:'半径1の観覧車に乗って角度 θ だけまわったとき、中心からの高さが sin θ、横のずれが cos θ。tan θ はその坂の傾き。',
key:`sin30° = ${fr(1,2)}、cos30° = ${fr(rt(3),2)}、sin45° = cos45° = ${fr(1,rt(2))}<br>tan θ = ${fr('sin θ','cos θ')}、sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1`,
trap:'90° をこえると cos はマイナスになる(点が中心より左側にあるから)。',
gen(){const ang=pick([0,30,45,60,90,120,135,150,180]);return trigQ(ang,ang+'°')}});

unit({id:'h1c',g:'数I',t:'一次不等式',tag:'マイナスをかけると向きが逆',lab:'ineq',
one:'不等式も天びんのように変形できる。ただし、マイナスをかけたり割ったりすると不等号の向きが逆になる。',
story:'3 < 5 の両辺に −1 をかけると −3 と −5。数直線では −3 の方が右にあるので −3 > −5。大小がひっくり返る。',
key:'両辺を負の数でかける・割る → 不等号の向きが逆',
trap:'−2x > 6 は x < −3。向きを変え忘れて x > −3 にしない。',
gen(){const a=pick([2,3,4,5,-2,-3,-4,-5]),k=rnz(-5,6),b=rnz(-9,9),c=a*k+b;const sym=pick(['>','<','≥','≤']);
 const flip={'>':'<','<':'>','≥':'≤','≤':'≥'};const s2=a>0?sym:flip[sym];
 return {q:`${poly([[a,'x'],[b,'']])} ${sym} ${neg(c)} を解こう`,a:`x ${s2} ${neg(k)}`,d:[`x ${flip[s2]} ${neg(k)}`,`x ${s2} ${neg(-k)}`,`x ${flip[s2]} ${neg(-k)}`,`x ${s2} ${neg(k+1)}`],
 ex:`${poly([[a,'x']])} ${sym} ${neg(c-b)}。両辺を ${paren(a)} でわる${a<0?'(負の数なので向きが逆)':''} → x ${s2} ${neg(k)}。`}}});

unit({id:'h1d',g:'数I',t:'分散と標準偏差',tag:'平均からのはなれ具合',lab:'variance',
one:'分散は「平均からどれくらいはなれているか」を1つの数にしたもの。',
story:'平均がどちらも60点でも、全員60点のクラスと、0点と100点がまざるクラスは違う。その違いをはかるのが分散。',
key:'偏差 = 値 − 平均<br>分散 = (偏差)<sup>2</sup> の平均、標準偏差 = √分散',
trap:'偏差をそのまま足すと必ず0になる。だから2乗してから平均する。',
gen(){const pats=[[-2,0,0,2],[-3,-1,1,3],[-1,-1,1,1],[-2,-1,1,2],[-4,0,1,3],[-3,0,1,2],[-2,-1,0,1,2],[-3,-1,0,1,3],[-2,-2,0,2,2],[-4,-1,0,2,3]];
 const dv=pick(pats),m=ri(3,8),n=dv.length;const data=shuffle(dv.map(x=>m+x));const S=dv.reduce((s,x)=>s+x*x,0),A=dv.reduce((s,x)=>s+Math.abs(x),0);
 return {q:`データ「${data.join(', ')}」の分散は?`,a:F(S,n),d:[neg(S),F(A,n),F(S,n-1),F(S+n,n)],ex:`平均は ${m}。偏差の2乗の合計は ${S}。${n} 個でわって ${F(S,n)}。`}}});

const fact=n=>n<=1?1:n*fact(n-1);
unit({id:'hAa',g:'数A',t:'場合の数',tag:'並べる? 選ぶだけ?',lab:'combo',
one:'並べ方(順列)は順番が大事。選び方(組合せ)は順番を気にしない。',
story:'5人からリレーの走る順番を3人分決めると 5 × 4 × 3 = 60 通り。3人の代表を選ぶだけなら、同じ3人の並べ方6通りを1つにまとめて 60 ÷ 6 = 10 通り。',
key:'<sub>n</sub>P<sub>r</sub> = n(n−1)…(n−r+1)<br><sub>n</sub>C<sub>r</sub> = <sub>n</sub>P<sub>r</sub> ÷ r!',
trap:'最初に「選ぶだけ」か「並べる」かを確認する。',
gen(){const n=ri(4,8),r=pick([2,3]),P=fact(n)/fact(n-r),C=P/fact(r);const T=v=>v+' 通り';
 if(Math.random()<.5)return {q:`${n} 人から ${r} 人の委員を選ぶ方法は?`,a:T(C),d:[T(P),T(n**r),T(n*r),T(C+n)],ex:`並べると <sub>${n}</sub>P<sub>${r}</sub> = ${P}。順番は関係ないので ${r}! = ${fact(r)} でわって ${C} 通り。`};
 return {q:`${n} 人から ${r} 人を選んで1列に並べる方法は?`,a:T(P),d:[T(C),T(n**r),T(n*r),T(P/2)],ex:`1番目 ${n} 通り、2番目 ${n-1} 通り${r===3?'、3番目 '+(n-2)+' 通り':''}。かけて ${P} 通り。`}}});

unit({id:'hAb',g:'数A',t:'整数の性質',tag:'正方形タイルでしきつめる',lab:'euclid',
one:'最大公約数は「長方形をすき間なくしきつめられる、いちばん大きい正方形タイル」の1辺。',
story:'18 × 12 の長方形から 12 × 12 の正方形を取ると 6 × 12 が残る。そこから 6 × 6 を2枚取るとぴったり終わる。だから最大公約数は6。これがユークリッドの互除法。',
key:'最大公約数 G、最小公倍数 L のとき<br>a × b = G × L',
trap:'公約数は「わり切れる小さい数」、公倍数は「両方の倍数で大きい数」。名前で混乱しないように。',
gen(){const g=ri(2,9),[m,n]=pick([[2,3],[3,4],[2,5],[3,5],[4,5],[5,6],[3,7],[2,7]]),a=g*m,b=g*n;
 if(Math.random()<.5)return {q:`${a} と ${b} の最大公約数は?`,a:''+g,d:[''+(g*m*n),''+(m*n),''+(g*2>a?g+1:g*2),''+Math.abs(a-b-1)],ex:`${a} = ${g} × ${m}、${b} = ${g} × ${n}。共通の約数で最大は ${g}。`};
 return {q:`${a} と ${b} の最小公倍数は?`,a:''+(g*m*n),d:[''+g,''+(a*b),''+(g*m*n*2),''+(a+b)],ex:`最大公約数 ${g} を使って ${a} × ${b} ÷ ${g} = ${g*m*n}。`}}});

unit({id:'h2a',g:'数II',t:'指数関数',tag:'倍々ゲームの数学',lab:'expo',
one:'指数は「何回かけるか」。2<sup>3</sup> = 2 × 2 × 2。',
story:'紙を半分に折るたびに厚さは2倍。10回折ると 2<sup>10</sup> = 1024 倍。指数関数は「倍々ゲーム」のグラフ。',
key:'a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>、(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup><br>a<sup>0</sup> = 1、a<sup>−n</sup> = 1 ÷ a<sup>n</sup>',
trap:'2<sup>3</sup> × 2<sup>4</sup> は 2<sup>12</sup> ではなく 2<sup>7</sup>。かける回数は足し算。',
gen(){const t=ri(0,3);
 if(t===0){const a=ri(2,6),b=ri(2,6);return {q:`${pw(2,a)} × ${pw(2,b)} = ?`,a:pw(2,a+b),d:[pw(2,a*b),pw(4,a+b),pw(2,Math.abs(a-b)||1),pw(4,a*b)],ex:`2を ${a} 回かけたものと ${b} 回かけたもの。合わせて ${a+b} 回。`}}
 if(t===1){const a=ri(2,5),b=ri(2,4);return {q:`(${pw(2,a)})<sup>${b}</sup> = ?`,a:pw(2,a*b),d:[pw(2,a+b),pw(2,a**b),pw(2*b,a),pw(2,a*b+1)],ex:`${pw(2,a)} を ${b} 回かけるので、2を ${a} × ${b} = ${a*b} 回かける。`}}
 if(t===2){const b=pick([2,3]),k=rnz(-3,b===2?6:4);const N=k>=0?''+b**k:fr(1,b**-k);return {q:`${pw(b,'x')} = ${N} のとき x は?`,a:neg(k),d:[neg(-k),neg(k+1),neg(k-1),''+(b**Math.abs(k))],ex:`${N} は ${b} を ${k>=0?k+' 回かけた数':(-k)+' 回かけた数の逆数'}。だから x = ${neg(k)}。`}}
 const [q,a,d]=pick([[pw(8,'1/3'),'2',['8/3','3','4']],[pw(27,'2/3'),'9','3,18,6'.split(',')],[pw(4,'3/2'),'8',['6','2','16']],[pw(16,'3/4'),'8',['12','4','2']],[pw(9,'−1/2'),fr(1,3),['−3','3',fr(1,9)]],[pw(25,'1/2'),'5',['12.5','10','625']]]);
 return {q:`${q} = ?`,a,d:d.map(s=>s.includes('/')&&!s.includes('<')?fr(...s.split('/')):s),ex:'分数の指数 a<sup>m/n</sup> は「n 乗根をとってから m 乗」。マイナスの指数は逆数。'}}});

unit({id:'h2b',g:'数II',t:'対数関数',tag:'「何回かけた?」をきく記号',lab:'log',
one:`${lg(2,8)} は「2 を何回かけたら 8 になる?」の答え。だから 3。`,
story:'対数は指数の逆向きの質問。ケタがまったく違う量(とても小さい数から、とても大きい数まで)を、扱いやすい大きさにして比べるときに使われる。',
key:`log<sub>a</sub> M + log<sub>a</sub> N = log<sub>a</sub> MN<br>log<sub>a</sub> a = 1、log<sub>a</sub> 1 = 0`,
trap:`${lg(2,'(8 + 4)')} は ${lg(2,8)} + ${lg(2,4)} ではない。足し算になるのは、中身がかけ算のとき。`,
gen(){const t=ri(0,2);
 if(t===0){const b=pick([2,3,5,10]),k=ri(-2,b===2?6:3);const arg=k>=0?''+b**k:fr(1,b**-k);return {q:`${lg(b,arg)} = ?`,a:neg(k),d:[neg(-k),neg(k+1),neg(k-1),neg(k*b)],ex:`${b} を ${neg(k)} 乗すると ${arg}。だから答えは ${neg(k)}。`}}
 if(t===1){const i=ri(1,4),j=ri(1,4);return {q:`${lg(2,2**i)} + ${lg(2,2**j)} = ?`,a:''+(i+j),d:[''+(i*j),''+(i+j+1),''+Math.abs(i-j),''+(2**i+2**j)],ex:`${lg(2,2**i)} = ${i}、${lg(2,2**j)} = ${j}。合わせて ${i+j}(${lg(2,2**(i+j))} と同じ)。`}}
 const b=pick([2,3,5,7]);return Math.random()<.5?{q:`${lg(b,1)} = ?`,a:'0',d:['1',''+b,fr(1,b)],ex:`どんな数も0乗すると1。だから ${lg(b,1)} = 0。`}:{q:`${lg(b,b)} = ?`,a:'1',d:['0',''+b,''+(b*b)],ex:`${b} を1回かけると ${b}。だから 1。`}}});

one:'円をくるくる回る点の高さを、時間にそって記録すると波(サインカーブ)になる。',
story:'観覧車の高さを横に記録していくと、山と谷がくり返す。角度は「半径何本分の弧か」で測る弧度法を使い、180° = π と表す。',

gen(){const t=ri(0,2);
 if(t===0){const d=pick(RADS);return {q:`${d}° を弧度法で表すと?`,a:Fpi(d,180),d:[Fpi(d,360),Fpi(d,90),Fpi(d+30,180),Fpi(d-15,180)],ex:`180° = π なので ${d}° = π × ${F(d,180)} = ${Fpi(d,180)}。`}}
 if(t===1){const d=pick(RADS);return {q:`${Fpi(d,180)} は何度?`,a:deg(d),d:[deg(d*2),deg(d/2),deg(d+30),deg(d+180)],ex:`π = 180° を入れて ${d}°。`}}

function makeG(cv){
 const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
 cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
 const css=getComputedStyle(document.documentElement);const col=n=>css.getPropertyValue('--'+n).trim();
 const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
 const g={c,w,h,col,x0:-5,x1:5,y0:-5,y1:5};
 g.view=(x0,x1,y0,y1,eq)=>{if(eq){const s=Math.min(w/(x1-x0),h/(y1-y0)),cx=(x0+x1)/2,cy=(y0+y1)/2;x0=cx-w/s/2;x1=cx+w/s/2;y0=cy-h/s/2;y1=cy+h/s/2}Object.assign(g,{x0,x1,y0,y1})};
 g.X=x=>(x-g.x0)/(g.x1-g.x0)*w;g.Y=y=>h-(y-g.y0)/(g.y1-g.y0)*h;g.S=d=>d/(g.x1-g.x0)*w;
 g.font=(sz=13,wt=700)=>{c.font=`${wt} ${sz}px ${FONT}`};
 g.grid=(sx=1,sy=sx)=>{c.lineWidth=1;c.strokeStyle=col('grid2');c.beginPath();
  for(let x=Math.ceil(g.x0/sx)*sx;x<=g.x1;x+=sx){const p=Math.round(g.X(x))+.5;c.moveTo(p,0);c.lineTo(p,h)}
  for(let y=Math.ceil(g.y0/sy)*sy;y<=g.y1;y+=sy){const p=Math.round(g.Y(y))+.5;c.moveTo(0,p);c.lineTo(w,p)}c.stroke()};
 g.axes=(lx=1,ly=lx,labels=true)=>{c.strokeStyle=col('muted');c.lineWidth=1.5;c.beginPath();c.moveTo(0,g.Y(0));c.lineTo(w,g.Y(0));c.moveTo(g.X(0),0);c.lineTo(g.X(0),h);c.stroke();
  if(!labels)return;g.font(11,600);c.fillStyle=col('muted');c.textAlign='center';c.textBaseline='top';
  for(let x=Math.ceil(g.x0/lx)*lx;x<=g.x1;x+=lx){if(Math.abs(x)<1e-9)continue;c.fillText(fmtN(x),g.X(x),Math.min(h-14,Math.max(2,g.Y(0)+4)))}
  c.textAlign='right';c.textBaseline='middle';
  for(let y=Math.ceil(g.y0/ly)*ly;y<=g.y1;y+=ly){if(Math.abs(y)<1e-9)continue;c.fillText(fmtN(y),Math.max(22,Math.min(w-4,g.X(0)-5)),g.Y(y))}};
 g.fn=(f,color,lw=3,a=g.x0,b=g.x1)=>{c.strokeStyle=color;c.lineWidth=lw;c.lineJoin='round';c.beginPath();let pen=false;
  const i0=Math.max(0,g.X(a)),i1=Math.min(w,g.X(b));
  for(let i=i0;i<=i1+.5;i+=1.5){const x=g.x0+(g.x1-g.x0)*Math.min(i,i1)/w,y=f(x);if(!isFinite(y)){pen=false;continue}const py=g.Y(y);if(py<-2*h||py>3*h){pen=false;continue}pen?c.lineTo(i,py):c.moveTo(i,py);pen=true}c.stroke()};
 g.seg=(x1,y1,x2,y2,color,lw=2,dash)=>{c.strokeStyle=color;c.lineWidth=lw;c.setLineDash(dash||[]);c.beginPath();c.moveTo(g.X(x1),g.Y(y1));c.lineTo(g.X(x2),g.Y(y2));c.stroke();c.setLineDash([])};
 g.arrow=(x1,y1,x2,y2,color,lw=3)=>{const X1=g.X(x1),Y1=g.Y(y1),X2=g.X(x2),Y2=g.Y(y2);const L=Math.hypot(X2-X1,Y2-Y1);if(L<1)return;
  c.strokeStyle=color;c.fillStyle=color;c.lineWidth=lw;c.lineCap='round';const ux=(X2-X1)/L,uy=(Y2-Y1)/L,hs=Math.min(12,L*.5);
  c.beginPath();c.moveTo(X1,Y1);c.lineTo(X2-ux*hs*.8,Y2-uy*hs*.8);c.stroke();
  c.beginPath();c.moveTo(X2,Y2);c.lineTo(X2-ux*hs-uy*hs*.55,Y2-uy*hs+ux*hs*.55);c.lineTo(X2-ux*hs+uy*hs*.55,Y2-uy*hs-ux*hs*.55);c.closePath();c.fill()};
 g.dot=(x,y,color,r=5,ring)=>{c.beginPath();c.arc(g.X(x),g.Y(y),r,0,7);c.fillStyle=color;c.fill();if(ring){c.lineWidth=2.5;c.strokeStyle=col('sheet');c.stroke()}};

 g.ptxt=(s,px,py,color,align='left',sz=13,base='top')=>{g.font(sz);c.fillStyle=color||col('ink');c.textAlign=align;c.textBaseline=base;c.fillText(s,px,py)};
 g.poly=(pts,fill,stroke,lw=2)=>{c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(g.X(x),g.Y(y)):c.moveTo(g.X(x),g.Y(y)));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}};
 g.circ=(x,y,r,stroke,fill,lw=2)=>{c.beginPath();c.arc(g.X(x),g.Y(y),g.S(r),0,7);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}};

 return g;
}

 return `a<sub>n</sub> = ${fr('2n + 1','n + 3')}　a<sub>${v.n}</sub> = ${B(a(v.n).toFixed(4))}<br><small>2 との差 ${(2-a(v.n)).toFixed(4)}。n を大きくすると、2 にはならないが、いくらでも 2 に近づく → 極限は 2。</small>`}};

// ===== app =====
const GR=[{k:'中1',n:'中学1年'},{k:'中2',n:'中学2年'},{k:'中3',n:'中学3年'},{k:'数I',n:'数学Ⅰ'},{k:'数A',n:'数学A'},{k:'数II',n:'数学Ⅱ'},{k:'数B',n:'数学B'},{k:'数III',n:'数学Ⅲ'},{k:'数C',n:'数学C'}];
const GL=k=>k.replace('III','Ⅲ').replace('II','Ⅱ').replace(/I$/,'Ⅰ');
const byId=id=>U.find(u=>u.id===id);
const inG=g=>U.filter(u=>u.g===g);
const KEY='sugaku-hogan-v1';
const DEF={xp:0,stars:{},read:{},lab:{},correct:0,answered:0,maxCombo:0,streak:0,last:'',daily:{d:'',xp:0},badges:{},lastUnit:null,grade:'中1'};
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s?{...DEF,...s}:{...DEF}}catch(e){return {...DEF}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DAILY=50;
const TITLES=['はじめの一歩','計算みならい','文字つかい','グラフ読み','図形の目','関数ハンター','証明の探偵','微積の旅人','ベクトル使い','数学の達人'];
const lvOf=xp=>{let L=1;while(25*(L+1)*L<=xp)L++;return L};
const lvBase=L=>25*L*(L-1);
const title=L=>TITLES[Math.min(L-1,TITLES.length-1)];
const starsOf=id=>S.stars[id]||0;
const totalStars=()=>U.reduce((s,u)=>s+starsOf(u.id),0);

function toast(msg,cls){const t=document.getElementById('toast');const d=document.createElement('div');d.innerHTML=msg;if(cls)d.className=cls;t.appendChild(d);setTimeout(()=>d.remove(),2600)}
function addXP(n){const before=lvOf(S.xp);S.xp+=n;const d=today();
 if(S.last!==d){S.streak=S.last===yest()?S.streak+1:1;S.last=d}
 if(S.daily.d!==d)S.daily={d,xp:0};const wasDone=S.daily.xp>=DAILY;S.daily.xp+=n;
 const after=lvOf(S.xp);if(after>before){toast(`レベルアップ! Lv.${after}「${title(after)}」`,'lvup');confetti()}
 if(!wasDone&&S.daily.xp>=DAILY)toast('きょうの目標 達成!','lvup');
 checkBadges();save();renderChip()}

const BADGES=[
 {id:'first',n:'はじめての正解',s:'初正解',ok:()=>S.correct>=1},
 {id:'c50',n:'正解 50 問',s:'50問',ok:()=>S.correct>=50},
 {id:'c200',n:'正解 200 問',s:'200問',ok:()=>S.correct>=200},
 {id:'cb5',n:'5 問連続正解',s:'5連続',ok:()=>S.maxCombo>=5},
 {id:'cb10',n:'10 問連続正解',s:'10連続',ok:()=>S.maxCombo>=10},
 {id:'perfect',n:'はじめての満点',s:'満点',ok:()=>Object.values(S.stars).some(v=>v>=3)},
 {id:'lab10',n:'実験を 10 単元',s:'実験家',ok:()=>Object.keys(S.lab).length>=10},
 {id:'st3',n:'3 日連続で学習',s:'3日',ok:()=>S.streak>=3},
 {id:'st7',n:'7 日連続で学習',s:'7日',ok:()=>S.streak>=7},
 {id:'mix',n:'ミックス 8 問以上',s:'ミックス',ok:()=>!!S.mixClear},
 ...GR.map(g=>({id:'g'+g.k,n:`${g.n} を全単元クリア`,s:GL(g.k)+'<br>修了',ok:()=>inG(g.k).every(u=>starsOf(u.id)>=1)})),
 {id:'all',n:'全単元で星3つ',s:'全制覇',ok:()=>U.every(u=>starsOf(u.id)>=3)}];
function checkBadges(){BADGES.forEach(b=>{if(!S.badges[b.id]&&b.ok()){S.badges[b.id]=today();setTimeout(()=>toast(`スタンプ獲得:${b.n}`),400)}})}

function renderChip(){const L=lvOf(S.xp),b=lvBase(L),nx=lvBase(L+1);document.getElementById('chip').innerHTML=`<span class="lv">Lv.${L}</span><span class="xpbar" title="次のレベルまで ${nx-S.xp} XP"><span style="width:${(S.xp-b)/(nx-b)*100}%"></span></span><span class="lv">${S.xp} XP</span>`}

// ---------- router ----------
let V={name:'home'};let curDraw=null;
function go(v){V=v;curDraw=null;render();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'})}
function render(){renderChip();const app=document.getElementById('app');if(V.name==='home')return home(app);if(V.name==='unit')return unitView(app);if(V.name==='mix')return quizView(app)}

// ---------- home ----------
function ring(p){const r=54,c=2*Math.PI*r;return `<svg viewBox="0 0 118 118" aria-hidden="true"><circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--grid2)" stroke-width="7"/><circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--red)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" transform="rotate(-90 59 59)"/></svg>`}
function home(app){const L=lvOf(S.xp),dx=S.daily.d===today()?S.daily.xp:0,lu=S.lastUnit&&byId(S.lastUnit);const g=S.grade;
 const nextU=inG(g).find(u=>starsOf(u.id)<1)||inG(g)[0];
 app.innerHTML=`
 <section class="sheet hero">
  <div class="lvbig">${ring(dx/DAILY)}<div><div class="s">LEVEL</div><div class="n">${L}</div><div class="s">${dx>=DAILY?'目標達成':'きょう '+dx+'/'+DAILY}</div></div></div>
  <div style="min-width:0">
   <div class="eyebrow">きょうのノート</div>
   <h1>${title(L)}</h1>
   <div class="stats"><span><b>${S.streak}</b>日連続</span><span><b>${totalStars()}</b>/ ${U.length*3} 星</span><span><b>${S.correct}</b>問 正解</span><span><b>${lvBase(L+1)-S.xp}</b>XP で次のレベル</span></div>
   <div class="row">
    ${lu?`<button class="btn hl" data-go="${lu.id}">続きから:${lu.t}</button>`:`<button class="btn hl" data-go="${nextU.id}">はじめる:${nextU.t}</button>`}
    <button class="btn ghost" id="mixbtn">ミックス10問に挑戦</button>
   </div>
  </div>
 </section>
 <section>
  <div class="eyebrow">学年のみちのり</div>
  <div class="tabs" role="tablist" style="margin-top:8px">${GR.map(x=>{const us=inG(x.k),st=us.reduce((s,u)=>s+starsOf(u.id),0);return `<button class="tab" role="tab" aria-selected="${x.k===g}" data-g="${x.k}">${GL(x.k)}<small>★${st}/${us.length*3}</small></button>`}).join('')}</div>
  <div class="sheet units">${inG(g).map((u,i)=>{const s=starsOf(u.id);return `<button class="unit ${s?'done':''}" data-go="${u.id}">
   <span class="no">${String(i+1).padStart(2,'0')}</span>
   <span style="min-width:0"><span class="tt">${u.t}</span><span class="tg">${u.tag}</span>
   <span class="marks"><span class="${S.read[u.id]?'on':''}">イメージ</span><span class="${S.lab[u.id]?'on':''}">さわる</span><span class="${s?'on':''}">チャレンジ</span></span></span>
   <span class="stars" aria-label="星 ${s} つ">${[1,2,3].map(k=>`<span class="${k<=s?'on':''}">★</span>`).join('')}</span></button>`}).join('')}</div>
 </section>
 <section>
  <div class="eyebrow">スタンプ帳　${Object.keys(S.badges).length} / ${BADGES.length}</div>
  <div class="stamps">${BADGES.map(b=>`<div class="stamp ${S.badges[b.id]?'got':''}"><div class="seal">${b.s}</div>${b.n}</div>`).join('')}</div>
 </section>
 <section class="foot">
  単元の並びは現行の学習指導要領(中学:2021年度〜、高校:2022年度入学生〜)の科目区分にもとづく目安です。教科書や学校によって扱う学年・順番が異なる場合があります。学習の記録はこのブラウザの中だけに保存されます。
  <div class="confirm" id="reset" style="margin-top:8px"><button class="btn ghost" data-reset="1" style="padding:5px 14px;font-size:12px">記録をリセット</button></div>
 </section>`;
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go({name:'unit',id:b.dataset.go,step:0}));
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.grade=b.dataset.g;save();home(app)});
 app.querySelector('#mixbtn').onclick=startMix;
 const rs=app.querySelector('#reset');rs.onclick=e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.reset==='1')rs.innerHTML=`<span>本当に消しますか?</span><button class="btn" data-reset="2" style="padding:5px 14px;font-size:12px;background:var(--red);border-color:var(--red)">消す</button><button class="btn ghost" data-reset="0" style="padding:5px 14px;font-size:12px">やめる</button>`;
  else if(t.dataset.reset==='2'){S={...DEF};save();go({name:'home'})}else home(app)};
}

// ---------- unit ----------
function unitView(app){const u=byId(V.id);S.lastUnit=u.id;save();const st=V.step||0;const done=[S.read[u.id],S.lab[u.id],starsOf(u.id)>0];
 const names=['イメージ','さわってみる','チャレンジ'];
 app.innerHTML=`<div class="uhead"><button class="back" id="bk">← 学年のみちのりへ</button><div style="margin-top:10px"><span class="gtag">${GR.find(x=>x.k===u.g).n}</span></div><h1>${u.t}</h1><div style="color:var(--muted)">${u.tag}</div></div>
 <div class="steps" role="tablist">${names.map((n,i)=>`<button class="step" role="tab" aria-selected="${i===st}" data-st="${i}"><small>STEP ${i+1}${done[i]?'<span class="ck">✓</span>':''}</small>${n}</button>`).join('')}</div>
 <section class="sheet panel" id="pn"></section>`;
 app.querySelector('#bk').onclick=()=>{S.grade=u.g;go({name:'home'})};
 app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{V.step=+b.dataset.st;unitView(app)});
 const pn=app.querySelector('#pn');
 if(st===0){pn.innerHTML=`<div class="eyebrow">ひとことで</div><p class="one"><span class="mk">${u.one}</span></p>
  <div class="sec"><h3>たとえば</h3><p style="margin:0">${u.story}</p></div>
  <div class="sec"><h3>これだけ覚える</h3><div class="keybox">${u.key}</div></div>
  <div class="sec"><p class="trap" style="margin:0">${u.trap}</p></div>
  <div class="next"><button class="btn hl" id="nx">わかった!さわってみる →</button></div>`;
  pn.querySelector('#nx').onclick=()=>{if(!S.read[u.id]){S.read[u.id]=1;addXP(5);toast('+5 XP イメージをつかんだ')}V.step=1;unitView(app)}}
 else if(st===1){mountLab(u,pn);const nx=document.createElement('div');nx.className='next';nx.innerHTML=`<button class="btn hl">チャレンジ 5問へ →</button>`;pn.appendChild(nx);nx.firstChild.onclick=()=>{V.step=2;unitView(app)}}
 else startQuiz(pn,[u],5,'unit');
}

function mountLab(u,host){const spec=LABS[u.lab];const st={opt:u.labOpt||{}};spec.init&&spec.init(st);const v={};spec.sliders.forEach(s=>v[s.k]=s.v);
 const fmt=(s,x)=>(s.step<1?fmtN(x):neg(x))+(s.u||'');
 host.innerHTML=`<div class="lab"><div class="eyebrow">スライダーを動かして、変化を見てみよう</div><div class="cvwrap"><canvas class="cv" role="img" aria-label="${u.t}の動く図"></canvas></div><div class="readout" aria-live="polite"></div>
 <div class="ctrls">${spec.sliders.map(s=>`<div class="sl"><label for="s-${u.id}-${s.k}">${s.l}<output data-sv="${s.k}">${fmt(s,s.v)}</output></label><input type="range" id="s-${u.id}-${s.k}" data-k="${s.k}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.v}"></div>`).join('')}</div>
 ${spec.buttons?`<div class="row">${spec.buttons.map((b,i)=>`<button class="btn ghost" data-b="${i}">${b.l}</button>`).join('')}</div>`:''}</div>`;
 const cv=host.querySelector('canvas'),ro=host.querySelector('.readout');
 const draw=()=>{const w=cv.parentElement.clientWidth;cv.style.height=Math.round(Math.max(190,Math.min(440,w*(spec.ratio||.62))))+'px';const g=makeG(cv);ro.innerHTML=spec.draw(g,v,st)||'';
  spec.sliders.forEach(s=>{const o=host.querySelector(`[data-sv="${s.k}"]`);if(o)o.textContent=fmt(s,v[s.k])})};
 const touched=()=>{if(!S.lab[u.id]){S.lab[u.id]=1;addXP(5);toast('+5 XP 実験した!')}};
 host.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',()=>{v[el.dataset.k]=+el.value;touched();draw()}));
 host.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{spec.buttons[+el.dataset.b].f(st,v);touched();draw()});
 curDraw=draw;draw();
 if(window.ResizeObserver){let lw=0;new ResizeObserver(()=>{const w=cv.parentElement.clientWidth;if(w!==lw&&curDraw===draw){lw=w;draw()}}).observe(cv.parentElement)}
}

// ---------- quiz ----------
let Q=null;
function startMix(){go({name:'mix'})}
function quizView(app){app.innerHTML=`<div class="uhead"><button class="back" id="bk">← もどる</button><h1 style="margin-top:8px">ミックス10問</h1><div style="color:var(--muted)">これまで学んだ単元からランダムに出題</div></div><section class="sheet panel" id="pn"></section>`;
 app.querySelector('#bk').onclick=()=>go({name:'home'});let pool=U.filter(u=>S.read[u.id]||S.lab[u.id]||S.stars[u.id]!=null);if(pool.length<3)pool=inG(S.grade);startQuiz(app.querySelector('#pn'),pool,10,'mix')}
function startQuiz(host,units,n,mode){Q={host,units,n,mode,i:0,score:0,combo:0,xp:0,res:[],cur:null,hint:false};nextQ()}
const HANA=`<svg class="hana" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c18 0 27 13 25 26S43 58 29 57 5 45 7 30 22 9 36 12s17 15 14 24-12 13-19 11-9-9-6-14 9-6 12-3"/></svg>`;
function nextQ(){const {host}=Q;if(Q.i>=Q.n)return endQuiz();const u=Q.units.length===1?Q.units[0]:pick(Q.units);Q.cur={u,...buildQ(u)};Q.hint=false;const q=Q.cur;
 host.innerHTML=`<div class="pips">${[...Array(Q.n)].map((_,i)=>`<i class="${i<Q.i?(Q.res[i]?'ok':'ng'):i===Q.i?'cur':''}"></i>`).join('')}</div>
 <div class="qhead"><span>第 ${Q.i+1} 問${Q.mode==='mix'?' ・ '+GL(u.g)+' '+u.t:''}</span><span class="combo">${Q.combo>=2?Q.combo+' 連続正解!':''}</span></div>
 <div class="q">${q.q}</div>
 <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
 <div class="row" style="margin-top:12px" id="hrow"><button class="btn ghost" id="hb" style="padding:6px 14px;font-size:13px">ヒントを見る(獲得XP 半分)</button></div><div id="fbx"></div>`;
 host.querySelector('#hb').onclick=()=>{Q.hint=true;host.querySelector('#hrow').innerHTML=`<div class="hint"><b>ヒント</b> ${u.key}</div>`};
 host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 const k=e=>{if(!Q||Q.cur!==q)return document.removeEventListener('keydown',k);const i='abcd'.indexOf(e.key.toLowerCase());if(i>=0&&i<q.opts.length&&!host.querySelector('.opt:disabled'))answer(i)};document.addEventListener('keydown',k)}
function answer(i){const {host,cur:q}=Q;const hb=host.querySelector('#hb');if(hb)hb.remove();const ok=i===q.correct;host.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('ok');else if(j===i)b.classList.add('ng')});
 S.answered++;let gain=0;
 if(ok){Q.combo++;Q.score++;S.correct++;S.maxCombo=Math.max(S.maxCombo,Q.combo);gain=(Q.hint?5:10)+Math.min(Q.combo-1,5)*2;Q.xp+=gain;addXP(gain)}else{Q.combo=0;save()}
 Q.res.push(ok);
 const fb=host.querySelector('#fbx');fb.innerHTML=`<div class="fb ${ok?'ok':'ng'}">${ok?HANA:'<div class="verdict" style="font-size:34px">✓</div>'}<div><div class="verdict">${ok?pick(['正解!','おみごと!','その調子!','バッチリ!']):'おしい!'}${ok?` <small>+${gain} XP</small>`:''}</div><div>${q.ex}</div>${ok?'':`<small>正しい答え:${q.a}</small>`}</div></div>
 <div class="next"><button class="btn hl" id="nq">${Q.i+1>=Q.n?'結果を見る':'次の問題 →'}</button></div>`;
 const nb=fb.querySelector('#nq');nb.onclick=()=>{Q.i++;nextQ()};nb.focus({preventScroll:true});fb.scrollIntoView({block:'nearest',behavior:'smooth'})}
function endQuiz(){const {host,mode,units,score,n}=Q;let stars=0,bonus=0,msg='';
 if(mode==='unit'){const u=units[0];stars=score>=5?3:score>=4?2:score>=3?1:0;const prev=starsOf(u.id);if(stars>prev||S.stars[u.id]==null)S.stars[u.id]=Math.max(prev,stars);if(score===n)bonus=20;msg=stars>prev&&prev?'自己ベスト更新!':''}
 else{stars=score>=10?3:score>=8?2:score>=6?1:0;if(score>=8)S.mixClear=1;bonus=score>=8?30:0}
 if(bonus){Q.xp+=bonus;addXP(bonus)}else{checkBadges();save()}
 if(stars===3)confetti();
 const cm=[ 'くり返すほど、確実に力がつく。もう一度やってみよう。','あと少し! ヒントを使ってもう一回。','いい感じ! 星3つまであと一歩。','完ぺき! 次の単元へ進もう。'][stars];
 const u=mode==='unit'?units[0]:null;const nextU=u&&U[U.indexOf(u)+1];
 host.innerHTML=`<div class="result"><div class="eyebrow">${mode==='unit'?u.t+' のチャレンジ':'ミックス10問'}</div>
 <div class="big" style="margin-top:10px">${score}<small style="font-size:22px"> / ${n}</small></div>
 <div class="rst" aria-label="星 ${stars} つ">${[1,2,3].map(k=>`<span class="${k<=stars?'on':''}" style="animation-delay:${k*.15}s">★</span>`).join('')}</div>
 ${msg?`<div class="good">${msg}</div>`:''}
 <div class="gain"><span>獲得 <b>${Q.xp}</b> XP</span>${bonus?`<span>ボーナス <b>+${bonus}</b></span>`:''}<span>最高連続 <b>${Math.max(...Q.res.reduce((a,r)=>{a.push(r?(a[a.length-1]||0)+1:0);return a},[0]))}</b></span></div>
 <p>${cm}</p>
 <div class="row" style="justify-content:center"><button class="btn ghost" id="again">もう一回</button>${nextU?`<button class="btn hl" id="nu">次の単元:${nextU.t} →</button>`:`<button class="btn hl" id="hm">ホームへ</button>`}</div></div>`;
 host.querySelector('#again').onclick=()=>mode==='unit'?startQuiz(host,units,n,mode):quizView(document.getElementById('app'));
 const nu=host.querySelector('#nu');if(nu)nu.onclick=()=>{S.grade=nextU.g;go({name:'unit',id:nextU.id,step:0})};
 const hm=host.querySelector('#hm');if(hm)hm.onclick=()=>go({name:'home'});Q=null}

// ---------- confetti ----------
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=document.getElementById('fx'),c=cv.getContext('2d');const W=cv.width=innerWidth,H=cv.height=innerHeight;
 const css=getComputedStyle(document.documentElement),cols=['--red','--blue','--green','--marker'].map(k=>css.getPropertyValue(k).trim());
 const ps=[...Array(90)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,a:Math.random()*6,c:pick(cols),s:Math.random()<.5}));let t=0;
 (function f(){c.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;p.s?c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2):(c.beginPath(),c.arc(0,0,p.r/2.4,0,7),c.fill());c.restore()});if(++t<110)requestAnimationFrame(f);else c.clearRect(0,0,W,H)})()}

// ---------- boot ----------
document.getElementById('home').onclick=()=>go({name:'home'});
const redraw=()=>{if(curDraw)curDraw()};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw)}catch(e){}
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
render();

</script>
</body>
</html>
